@if (status() !== 'error') {
  <div class="cv-viewfinder">
    <video
      #videoEl
      autoplay
      muted
      playsinline
      class="cv-viewfinder__video"
      aria-label="Live camera feed for card scanning"
    ></video>
    <canvas #overlayCanvas class="cv-viewfinder__overlay" aria-hidden="true"></canvas>
  </div>
}

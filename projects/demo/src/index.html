<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ng-collector-vision demo</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <!--
    Cross-Origin Isolation required for SharedArrayBuffer → multi-threaded WASM (ort-web).
    The service worker injects COOP + COEP headers on same-origin responses.
    On the first visit it reloads the page once after claiming; subsequent visits are seamless.
  -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('coi-serviceworker.js').then((reg) => {
        // If a new SW just installed, reload so the page runs under the new headers.
        if (reg.installing) {
          reg.installing.addEventListener('statechange', (e) => {
            if (e.target.state === 'activated') location.reload();
          });
        }
      });
    }
  </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>

name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write   # create GitHub release
  id-token: write   # npm provenance

jobs:
  release:
    name: Build, test & publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      # ── Verify ──────────────────────────────────────────────────────────────

      - name: Prettier check
        run: npx prettier --check .

      - name: TypeScript type-check (lib)
        run: npx tsc -p projects/ng-collector-vision/tsconfig.lib.json --noEmit

      - name: Run library tests
        run: npx ng test ng-collector-vision --watch=false

      # ── Build ────────────────────────────────────────────────────────────────

      - name: Build ng-collector-vision
        run: npx ng build ng-collector-vision --configuration production

      # ── Stamp version ────────────────────────────────────────────────────────
      # Strip the leading 'v' from the tag (v1.2.3 → 1.2.3) and write it into
      # the package.json that ng-packagr outputs in dist/.

      - name: Stamp version from tag
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          npm version --no-git-tag-version "$VERSION" \
            --prefix dist/ng-collector-vision

      # ── Publish ──────────────────────────────────────────────────────────────

      - name: Publish to npm
        run: npm publish dist/ng-collector-vision --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # ── GitHub release ───────────────────────────────────────────────────────

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/ng-collector-vision/*.tgz
